# should-i-read operator config (example / init template)
#
# Optional CLI brand colors (xterm-256 indices, also used by Taskfile list):
#   export OPERATOR_CLI_THEME_ACCENT=42   # verbs, titles, success (default green)
#   export OPERATOR_CLI_THEME_MARK=214    # bullets, borders (default gold)
#
# Live file: ~/.config/should-i-read/config.yaml (mode 0600)
# Override: --config or SHOULD_I_READ_CONFIG
#
# Secrets MUST use ${ENV_NAME} placeholders. Values resolve from environment,
# platform keyring (service should-i-read), then optional secrets.enc.yaml (SOPS).
# Store keyring values: should-i-read secret set ENV_NAME

secrets:
  - POLYPUS_BASE_URL
  - EMAILOPS_GMAIL_CLIENT_ID
  - EMAILOPS_GMAIL_CLIENT_SECRET
  - EMAILOPS_OUTLOOK_CLIENT_ID
polypus:
  # Resolves from env when unset in YAML; fallback http://127.0.0.1:1320
  base_url: "${POLYPUS_BASE_URL}"
  # Classify Author (chat). On routed Polypus homelabs prefer cf_local/@cf/... over bare @cf/... ids.
  classify_model: "cf_local/@cf/ibm-granite/granite-4.0-h-micro"
  # Classify Judge (SystemOne). Empty enables catalog + probe discovery.
  judge_model: "cf_local/typesafe/jev"
  # Attach embeddings (default cf_local/@cf/baai/bge-m3 when listed)
  embed_model: "cf_local/@cf/baai/bge-m3"

taxonomy:
  # Optional; walk defaults to inbox-mail under ~/.config/should-i-read/vocabularies/
  catalog_path: ""
  # Folders for mail report listing (default imap/INBOX). Empty list = all folders.
  collections:
    - imap/INBOX
  # When false (default), Judge skip does not call Author chat (report-only)
  author_on_skip: false
  # Max Operate (Polypus) calls per run (default 50)
  classify_max: 0
  # walk (Judge tree) or attach (Essence + embed on inbox-kind catalog)
  strategy: walk
  # Harness min judge gate; 0 disables (default)
  min_judge_score: 0
  attach_min_cosine: 0.80
  walk_reinforce_min: 0.70
  # Attach essence prefetch batch size (default 8, max 16)
  essence_batch_size: 8

pimalaya:
  # Empty: resolve neverest from PATH or ~/.cargo/bin
  neverest_bin: ""
  neverest_config: ""
  default_account: ""
  # Directory containing pimdir.db (Neverest account store)
  pimdir_path: ""

oauth:
  gmail_client_id: "${EMAILOPS_GMAIL_CLIENT_ID}"
  gmail_client_secret: "${EMAILOPS_GMAIL_CLIENT_SECRET}"
  outlook_client_id: "${EMAILOPS_OUTLOOK_CLIENT_ID}"
